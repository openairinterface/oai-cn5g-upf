##### Base configuration #####

# Name of the component, used towards NRF. Valid values: any string, DEFAULT="PCF"
name: "{{ env["UPF_NAME"] if "UPF_NAME" in env.keys() else 'OAI-UPF' }}"

##### Options to enable/disable #####
# If "on": Register to NRF, DEFAULT= off
register_nrf: {{ env["REGISTER_NRF"] if "REGISTER_NRF" in env.keys() else 'no' }}
# If "2":  Send only HTTP/2 requests, DEFAULT=1 (HTTP1)
client_http_version: {{ env["CLIENT_HTTP_VERSION"] if "CLIENT_HTTP_VERSION" in env.keys() else '1' }}
# If "on": Register to NRF, DEFAULT= off
enable_fqdn: {{ env["ENABLE_FQDN"] if "ENABLE_FQDN" in env.keys() else 'no' }}
# If "on": Nating of UE source address, DEFAULT= off
enable_ue_snat: {{ env["ENABLE_UE_SNAT"] if "ENABLE_UE_SNAT" in env.keys() else 'no' }}

# Next hop SBI interfaces
## host: IPv4 address or hostname
## api_version: Allowed values: "v1", "v2", used to create the 3GPP API version for the SBI URL
nrf:
  host: "{{ env["NRF_HOST"] if "NRF_HOST"in env.keys() else 'oai-nrf' }}"
  port: {{ env["NRF_PORT"] if "NRF_PORT" in env.keys() else '80' }}
  api_version: "{{ env["NRF_API_VERSION"] if "NRF_API_VERSION" in env.keys() else 'v1' }}"

smf:
  - host: "{{ env["SMF_HOST"] if "SMF_HOST"in env.keys() else 'oai-smf' }}"

##### UPF interfaces #####
n3:
  port: {{ env["N3_INTERFACE"] if "N3_INTERFACE" in env.keys() else 'eth0' }}
  addr: {{ env["N3_IPV4_ADDRESS"] if "N3_IPV4_ADDRESS" in env.keys() else 'read' }}
  nwi:  {{ env["N3_NWI"] if "N3_NWI" in env.keys() else 'oai.n3.org' }}

n4:
  port: {{ env["N4_INTERFACE"] if "N4_INTERFACE" in env.keys() else 'eth0' }}
  addr: {{ env["N4_IPV4_ADDRESS"] if "N4_IPV4_ADDRESS" in env.keys() else 'read' }}
  nwi:  {{ env["N4_NWI"] if "N4_NWI" in env.keys() else 'oai.n4.org' }}

n6:
  port: {{ env["N6_INTERFACE"] if "N6_INTERFACE" in env.keys() else 'eth0' }}
  addr: {{ env["N6_IPV4_ADDRESS"] if "N6_IPV4_ADDRESS" in env.keys() else 'read' }}
  nwi:  {{ env["N6_NWI"] if "N6_NWI" in env.keys() else 'oai.n6.org' }}

n9:
  port: {{ env["N9_INTERFACE"] if "N9_INTERFACE" in env.keys() else 'eth0' }}
  addr: {{ env["N9_IPV4_ADDRESS"] if "N9_IPV4_ADDRESS" in env.keys() else 'read' }}
  nwi:  {{ env["N9_NWI"] if "N9_NWI" in env.keys() else 'oai.n9.org' }}

##### UE Information #####
pdn_network_list:
  - network_ipv4: {{ env["NETWORK_UE_IP"] if "NETWORK_UE_IP" in env.keys() else '12.1.1.0/24' }}

##### UPF Information #####
upf_info:
  - sst: "{{ env["NSSAI_SST_0"] if "NSSAI_SST_0" in env.keys() else '1' }}";
    sd:  "{{ env["NSSAI_SD_0"] if "NSSAI_SD_0" in env.keys() else '0xFFFFFF' }}";
    dnn:  "{{ env["DNN_0"] if "DNN_0" in env.keys() else 'oai' }}";

  - sst: "{{ env["NSSAI_SST_1"] if "NSSAI_SST_1" in env.keys() else '2' }}";
    sd:  "{{ env["NSSAI_SD_1"] if "NSSAI_SD_1" in env.keys() else '0xFFFFFF' }}";
    dnn:  "{{ env["DNN_1"] if "DNN_1" in env.keys() else 'default' }}";

  - sst: "{{ env["NSSAI_SST_2"] if "NSSAI_SST_0" in env.keys() else '3' }}";
    sd:  "{{ env["NSSAI_SD_2"] if "NSSAI_SD_0" in env.keys() else '0xFFFFFF' }}";
    dnn:  "{{ env["DNN_2"] if "DNN_2" in env.keys() else 'oai.ipv4' }}";