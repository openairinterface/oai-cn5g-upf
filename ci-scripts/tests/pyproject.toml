# SPDX-License-Identifier: MIT
[project]
name = "oai-upf-tests"
version = "0.1.0"
description = "PFCP/N4 test suite for the OAI CN5G UPF, on the reusable pfcpkit library"
requires-python = ">=3.10"
# pfcpkit is not on PyPI, hence the direct reference. Pinned to a branch until
# pfcp-kit cuts its first tagged release; swap the ref for a tag at that point
# (e.g. `@v0.1.0`) so this suite stops moving with pfcp-kit's default branch.
# git+ssh, not git+https: the repo is currently private, so pip needs your SSH
# key rather than a token. Switch back to git+https once the repo is public.
dependencies = [
    "scapy>=2.7.0",
    "pfcpkit @ git+ssh://git@github.com/openairinterface/pfcp-kit.git@feat-initial-import",
]

[project.optional-dependencies]
# `oai` holds what only this UPF's tooling needs, kept out of the base install.
# PyYAML exists solely for conf/make_test_config.py, which rewrites etc/config.yaml.
oai = ["PyYAML>=6.0"]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.10", "oai-upf-tests[oai]"]

# `upf_test` is everything about this UPF: BPF map catalogue, HTB class-id
# arithmetic, log strings, deployment settings, and every scenario. The
# UPF-agnostic machinery it builds on -- PFCP transport, models, report,
# scenario base and registry, capability protocols, generic inspectors -- is
# `pfcpkit`, an external dependency from https://github.com/openairinterface/pfcp-kit
# rather than a package in this repo. `unit/test_boundary.py` checks that
# `upf_test` actually depends on it rather than reimplementing it.
[tool.setuptools.packages.find]
include = ["upf_test*"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RET",           # return consistency
    "ARG",           # unused arguments
    "PTH",           # prefer pathlib
]
ignore = [
    "B008",  # function call in default argument -- not used here, but noisy with dataclasses
]

[tool.ruff.lint.per-file-ignores]
# B027: the scenario base intentionally gives `arrange` and `teardown` non-abstract
# no-op defaults -- a scenario whose subject *is* establishment has nothing to
# arrange, and forcing every subclass to write `pass` would be noise. Only `act`
# and `verify` are @abstractmethod. Scenarios themselves legitimately assign
# attributes in act() that verify() reads.
"upf_test/scenarios/*.py" = ["B027"]
"unit/**/*.py" = [
    # Tests import scapy IE classes locally to keep each assertion self-describing.
    "PLC0415",
    # Test doubles implement an interface and need its full signature whether or
    # not every parameter is used -- inherent to a fake, not a smell.
    "ARG002",
]

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true

# Neither scapy nor PyYAML ships type information (types-PyYAML exists, but is
# not worth a dependency for one config-generation script).
[[tool.mypy.overrides]]
module = ["scapy.*", "yaml"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Test discovery
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["unit", "."]
python_files = ["test_*.py"]
markers = [
    "integration: requires a running UPF (deselect with '-m \"not integration\"')",
]
