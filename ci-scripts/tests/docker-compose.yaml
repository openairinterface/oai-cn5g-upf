# SPDX-License-Identifier: MIT
#
# Integration test topology for the UPF PFCP suite.
#
# Three networks mirror the real N4/N3/N6 split so PDRs and FARs address
# plausible addresses. The test runner normally executes on the *host* -- Docker
# bridge networks are reachable from there, and a PFCP session lifecycle needs a
# persistent socket that repeated `docker exec` calls would discard.
#
# `interface_name` pins each attachment to a deterministic name inside the
# container, so the UPF config can name n3/n4/n6 directly instead of depending on
# Docker's (non-contractual) eth* ordering. Requires Docker Compose >= v2.30;
# setup_env.sh verifies the names really took effect, since an older Compose
# would accept the key and silently ignore it.
#
# Bring up with ./setup_env.sh, which generates conf/upf_test.yaml and runs the
# preflight checks.

name: upf-pfcp-tests

services:
  upf:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.upf.ubuntu
    image: oai-upf:pfcp-tests
    container_name: ${UPF_CONTAINER:-upf-test}
    # eBPF needs NET_ADMIN (XDP/tc attach), SYS_ADMIN (bpffs, map ops) and
    # SYS_RESOURCE (setrlimit(RLIMIT_MEMLOCK) for map allocation). `privileged`
    # is the pragmatic default because generic-mode XDP on veth plus tc qdisc
    # manipulation trips over capability edges on some kernels; drop it to the
    # explicit cap_add list if your host permits.
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
    volumes:
      # Generated by setup_env.sh -- see conf/make_test_config.py.
      - ./conf/upf_test.yaml:/openair-upf/etc/config.yaml:ro
    sysctls:
      - net.ipv4.conf.all.forwarding=1
    networks:
      n4:
        ipv4_address: 192.168.70.134
        interface_name: n4
      n3:
        ipv4_address: 192.168.72.134
        interface_name: n3
      n6:
        ipv4_address: 192.168.73.134
        interface_name: n6
    healthcheck:
      # The image ships its own healthcheck; this override just makes readiness
      # explicit for setup_env.sh to wait on.
      test: ["CMD-SHELL", "pgrep -f oai_upf > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Minimal stand-in for the gNB on N3. It does nothing but hold the address --
  # which is the point: downlink FARs name it in Outer Header Creation, and the
  # UPF resolves that next hop with active `arping` (NextHopFinder never reads
  # the kernel neighbour cache), so something must actually answer on the wire.
  #
  # Without it every downlink FAR logs three failed ARP attempts and stores a
  # zero MAC in arp_table_map. Sessions still establish, but the retries cost
  # time on each modification and the errors clutter the logs that log-scraping
  # assertions have to read past.
  gnb-sim:
    image: alpine:3.20
    container_name: gnb-sim
    command: ["sleep", "infinity"]
    networks:
      n3:
        ipv4_address: 192.168.72.141
        interface_name: n3

  # Optional containerised runner, for CI hosts where installing scapy on the
  # agent is undesirable. Runs the same package as the host path; inspection
  # reaches the UPF through the mounted Docker socket.
  #   docker compose --profile containerised run --rm test-runner --all
  test-runner:
    profiles: [containerised]
    build:
      context: .
      dockerfile: Dockerfile.tests
    image: upf-pfcp-tests:latest
    depends_on:
      upf:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/tests
    working_dir: /tests
    environment:
      UPF_N4_ADDR: 192.168.70.134
      UPF_N3_ADDR: 192.168.72.134
      GNB_N3_ADDR: 192.168.72.141
      CP_NODE_ID: 192.168.70.140
      UPF_CONTAINER: ${UPF_CONTAINER:-upf-test}
      N3_IFACE: ${N3_IFACE:-n3}
      N6_IFACE: ${N6_IFACE:-n6}
    networks:
      n4:
        ipv4_address: 192.168.70.140
        interface_name: n4
    entrypoint: ["python3", "run_scenarios.py"]

networks:
  # /26 subnets, so the gateway is .129 rather than .1 -- worth remembering when
  # reading source addresses in a capture.
  n4:
    name: upf-test-n4
    ipam:
      config:
        - subnet: 192.168.70.128/26
  n3:
    name: upf-test-n3
    ipam:
      config:
        - subnet: 192.168.72.128/26
  n6:
    name: upf-test-n6
    ipam:
      config:
        - subnet: 192.168.73.128/26
